name: Vérifications

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scripts shell (shellcheck)
        run: |
          shellcheck -S warning distro/*.sh distro/scripts/*.sh distro/live/auto/* distro/live/config/hooks/normal/*
          # Scripts du shell (outils administrateur, sauvegarde, session, tests) : tous en sh POSIX.
          shellcheck -S warning -s sh shell/system/vinx-admin shell/system/vinx-backup shell/system/vinx-dev \
            shell/system/vinx-snapshots shell/system/vinx-update shell/system/vinx-greeter-sync shell/system/vinx-i18n.sh shell/system/vinx-release.in \
            shell/session/vinx-session shell/session/vinx-shell-autostart shell/session/vinx-shellctl shell/tests/*.sh
      - name: JavaScript des outils et de la disposition Plasma
        run: |
          for f in shell/tools/*.js distro/live/config/includes.chroot/usr/share/plasma/look-and-feel/*/contents/layouts/*.js; do
            [ -e "$f" ] || continue   # motif sans fichier (plus de .js dans shell/tools)
            node --check "$f"
          done
      - name: Générateur de thème
        run: python3 shell/tools/gen_theme.py branding/tokens.toml "$(mktemp)"
      - name: Génération des images
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          tmp="$(mktemp -d)"
          cp -r distro/live/config/includes.chroot "$tmp/"
          ./distro/scripts/render-assets.sh "$tmp/includes.chroot" "$tmp/boot"
