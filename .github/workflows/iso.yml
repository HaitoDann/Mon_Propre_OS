name: ISO VinX OS

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "distro/**"
      - "branding/**"
      - "shell/**"
      - ".github/workflows/iso.yml"
    tags: ["v*"]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Construire l'ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Construire dans un conteneur Debian 13
        run: sudo ./distro/docker-build.sh

      - name: Publier l'ISO
        uses: actions/upload-artifact@v4
        with:
          name: vinx-os-iso
          path: |
            distro/out/*.iso
            distro/out/*.sha256
          compression-level: 0
          retention-days: 14

      - name: Publier le journal en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vinx-os-build-log
          path: distro/build/build.log
          if-no-files-found: ignore
