name: ISO VinX OS

# Construction longue (30–40 min), pour économiser les minutes GitHub Actions, seulement :
#  - à la demande (onglet Actions → Run workflow),
#  - sur une version étiquetée (v*),
#  - sur une poussée dont le message de commit contient « [iso] ».
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Construire l'ISO
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[iso]')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Construire dans un conteneur Debian 13
        run: sudo ./distro/docker-build.sh

      - name: Publier l'ISO
        uses: actions/upload-artifact@v4
        with:
          name: vinx-os-iso
          path: |
            distro/out/*.iso
            distro/out/*.sha256
          compression-level: 0
          retention-days: 14

      # Test de démarrage : l'ISO démarre dans une machine virtuelle jusqu'au bureau VinX.
      - name: Outils du test de démarrage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 socat xorriso imagemagick
          # Accélération matérielle (KVM) sur les machines GitHub.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Vérifier le dépôt hors ligne de l'installateur
        run: |
          iso=$(ls distro/out/*.iso)
          xorriso -osirrox on -indev "$iso" -extract /dists/trixie/main/binary-amd64/Packages /tmp/Packages
          for p in grub-efi-amd64 grub-pc cryptsetup-initramfs; do
            grep -q "^Package: $p$" /tmp/Packages || { echo "Absent de l'ISO : $p"; exit 1; }
          done
          xorriso -indev "$iso" -find /pool/main -name 'grub-efi-amd64_*.deb' 2>/dev/null | grep -q deb

      - name: Tester le démarrage de l'ISO
        run: ./distro/tests/boot-test.sh distro/out/*.iso boot-test 900

      - name: Publier les captures du test de démarrage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinx-os-test-demarrage
          path: boot-test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier le journal en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vinx-os-build-log
          path: distro/build/build.log
          if-no-files-found: ignore
