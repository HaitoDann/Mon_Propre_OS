<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VinX OS — Desktop Shell</title>
<!-- Design system -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<!-- Composants du shell -->
<link rel="stylesheet" href="css/topbar.css">
<link rel="stylesheet" href="css/popover.css">
<link rel="stylesheet" href="css/dock.css">
<link rel="stylesheet" href="css/window.css">
<link rel="stylesheet" href="css/launcher.css">
</head>
<body>
<div id="desktop">
  <div id="windows"></div>
  <header id="topbar"></header>
  <nav id="dock" class="material" aria-label="Dock"></nav>

  <div id="launcher" class="hidden">
    <div class="launcher-box material">
      <div class="search-field"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" placeholder="Rechercher une application…" autocomplete="off"></div>
      <div id="app-grid"></div>
    </div>
  </div>

  <div id="toasts"></div>
</div>

<!-- Ordre de chargement : noyau → données → composants → démarrage -->
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/apps.js"></script>
<script src="js/popover.js"></script>
<script src="js/wm.js"></script>
<script src="js/dock.js"></script>
<script src="js/topbar.js"></script>
<script src="js/launcher.js"></script>
<script src="js/main.js"></script>
</body>
</html>
