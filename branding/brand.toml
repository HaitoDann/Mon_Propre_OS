# Source de vérité de l'identité visuelle.
# Ces valeurs alimentent prototype/tokens.css aujourd'hui, puis le design system QML.
[identity]
name = "VinX OS"
version = "0.1"
tagline = "Simple. Ergonomique. Stable."

[logo]
svg = "logo/vinx-logo.svg"
white = "logo/vinx-logo-white.svg"
gradient = "logo/vinx-logo-gradient.svg"
wallpaper = "wallpaper/vinx-nebula.svg"

[colors]
accent = "#A855F7"          # violet du logo
accent_light_theme = "#7C3AED"
gradient = ["#6366F1", "#A855F7"]
background_dark = "#0D0B1A"
background_light = "#F7F5FF"
success = "#22C55E"
warning = "#F59E0B"
danger = "#EF4444"

[typography]
family = "Inter"
fallback = "system-ui, sans-serif"

[shape]
radius_window = 14
radius_control = 10
radius_dock = 22

[motion]
fast_ms = 120
normal_ms = 220
