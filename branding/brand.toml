# Source de vérité de l'identité visuelle.
# Ces valeurs alimentent prototype/tokens.css aujourd'hui, puis le design system QML.
[identity]
name = "VinX OS"
version = "0.1"
tagline = "Simple. Ergonomique. Stable."

[logo]
svg = "logo/vinx-logo.svg"
white = "logo/vinx-logo-white.svg"
gradient = "logo/vinx-logo-gradient.svg"
wallpaper = "wallpaper/vinx-graphite.svg"

[colors]
logo = "#A855F7"            # violet du logo — réservé au logo (voir docs/DESIGN.md)
accent = "#5B65C9"          # accent de l'interface (indigo désaturé)
accent_light_theme = "#4E58BE"
logo_gradient = ["#6366F1", "#A855F7"]
background_dark = "#141517"
background_light = "#F5F5F7"
success = "#22C55E"
warning = "#F59E0B"
danger = "#EF4444"

[typography]
family = "Inter"
fallback = "system-ui, sans-serif"

[shape]
radius_window = 14
radius_control = 10
radius_dock = 22

[motion]
fast_ms = 120
normal_ms = 220
