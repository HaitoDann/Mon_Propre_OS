# Source de vérité de l'identité visuelle.
# Ces valeurs alimentent prototype/tokens.css aujourd'hui, puis le design system QML.
[identity]
name = "osname"          # nom provisoire
tagline = "Simple. Ergonomique. Stable."

[colors]
accent = "#4F7CFF"
accent_alt = "#8B5CF6"
success = "#22C55E"
warning = "#F59E0B"
danger = "#EF4444"

[typography]
family = "Inter"
fallback = "system-ui, sans-serif"

[shape]
radius_window = 14
radius_control = 10
radius_dock = 22

[motion]
fast_ms = 120
normal_ms = 220
