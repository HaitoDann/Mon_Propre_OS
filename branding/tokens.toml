# Design tokens VinX OS — source unique du style (voir docs/DESIGN.md).
# Consommé par shell/tools/gen_theme.py (→ Theme.qml). Couleurs : #RRGGBB ou #RRGGBBAA.
#
# Identité (ADR 0018) : design industriel et tech sobre. Base claire chaude (blanc cassé, encre
# noire), un seul accent : le vert du logo, jamais en dégradé. Contrastes WCAG AA : le vert est clair,
# on écrit donc en encre foncée dessus ; en texte sur fond clair, on utilise sa nuance foncée.

[brand]
# Vert du logo : fonds de bouton principal, interrupteurs actifs, curseurs.
accent_fill = ["#10DD8C", "#10DD8C"]
accent_foreground = ["#10DD8C", "#0A7F51"]  # texte, icônes et anneaux de focus colorés (≥ 4,5:1)
accent_text = "#06130D"                     # encre posée sur le vert (≥ 10:1)
logo = "#10DD8C"                            # couleur du logo

[state]
success = "#3FA66B"
warning = "#D4A13C"
danger = "#E5484D"

[font]
family = "IBM Plex Sans"
xs = 11
sm = 12
md = 13
lg = 15
xl = 20
display = 56

[space]
s1 = 4
s2 = 8
s3 = 12
s4 = 16
s5 = 24
s6 = 32

[radius]
xs = 5
sm = 7
md = 10
lg = 12
xl = 16

[shell]
topbar_height = 34
dock_icon = 48
dock_icon_max = 64

[motion]
fast = 120
normal = 200
slow = 320

# Couleurs dépendant du thème : [sombre, clair]
[themed]
background = ["#121413", "#ECEBE6"]
surface_glass = ["#1A1C1BEB", "#F8F7F4EB"]         # barre, dock (flou fourni par KWin)
surface_glass_strong = ["#1E2120", "#F8F7F4"]       # menus et panneaux : opaques (surface « élevée »)
surface_window = ["#1A1C1B", "#F8F7F4"]
surface_sunken = ["#151716", "#EFEEE9"]
surface_hover = ["#FFFFFF0F", "#1414140A"]
surface_active = ["#FFFFFF1A", "#14141414"]
text = ["#ECECEA", "#141414"]
text_secondary = ["#A3A6A3", "#5F5E5A"]
text_tertiary = ["#7A7D7A", "#8A8983"]
border = ["#FFFFFF14", "#D8D6CF"]
border_strong = ["#FFFFFF24", "#C9C7C0"]
shadow = ["#00000066", "#0000001F"]
