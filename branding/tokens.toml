# Design tokens VinX OS — source unique du style (voir docs/DESIGN.md).
# Consommé par shell/tools/gen_theme.py (→ Theme.qml). Couleurs : #RRGGBB ou #RRGGBBAA.
#
# Principes : base neutre (gris légèrement froids, jamais de noir pur ni de fond teinté),
# un seul accent sobre réservé aux états et à l'action principale, contrastes WCAG AA
# (texte ≥ 4,5:1, éléments d'interface ≥ 3:1). Le violet de la marque est réservé au logo.

[brand]
# Indigo désaturé, dérivé de l'indigo du logo, utilisé avec parcimonie.
accent_fill = ["#5B65C9", "#4E58BE"]        # fonds de bouton principal, interrupteurs actifs
accent_foreground = ["#7C86E0", "#4E58BE"]  # texte, icônes et anneaux de focus colorés
accent_text = "#FFFFFF"                     # texte posé sur l'accent
logo = "#A855F7"                            # couleur du logo (marque) — pas pour l'interface

[state]
success = "#3FA66B"
warning = "#D4A13C"
danger = "#E5484D"

[font]
family = "Inter"
xs = 11
sm = 12
md = 13
lg = 15
xl = 20
display = 56

[space]
s1 = 4
s2 = 8
s3 = 12
s4 = 16
s5 = 24
s6 = 32

[radius]
xs = 5
sm = 7
md = 10
lg = 12
xl = 16

[shell]
topbar_height = 34
dock_icon = 48
dock_icon_max = 64

[motion]
fast = 120
normal = 200
slow = 320

# Couleurs dépendant du thème : [sombre, clair]
[themed]
background = ["#141517", "#F5F5F7"]
surface_glass = ["#1C1D20E0", "#FFFFFFD9"]         # barre, dock (flou fourni par KWin)
surface_glass_strong = ["#232427", "#FFFFFF"]       # menus et panneaux : opaques (surface « élevée »)
surface_window = ["#1B1C1F", "#FFFFFF"]
surface_sunken = ["#17181A", "#F0F0F2"]
surface_hover = ["#FFFFFF0F", "#0000000A"]
surface_active = ["#FFFFFF1A", "#00000012"]
text = ["#ECECEE", "#1D1D1F"]
text_secondary = ["#A1A1A8", "#6B6B73"]
text_tertiary = ["#76767E", "#8E8E96"]
border = ["#FFFFFF12", "#0000000F"]
border_strong = ["#FFFFFF1F", "#0000001A"]
shadow = ["#00000066", "#0000001F"]
