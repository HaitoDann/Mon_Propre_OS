# Chargeur de démarrage du système installé.
GRUB_DISTRIBUTOR="VinX OS"
GRUB_TIMEOUT=3
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_BACKGROUND="/usr/share/images/vinx/grub.png"
GRUB_GFXMODE=auto
# Fond clair : menu à l'encre, entrée sélectionnée en vert (« black » en fond = transparent).
GRUB_COLOR_NORMAL="black/black"
GRUB_COLOR_HIGHLIGHT="green/black"
